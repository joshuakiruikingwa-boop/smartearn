<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | DURKC QUASH Admin</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-container { background: #fff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; color: #1a73e8; text-align: center; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.5rem; color: #555; font-weight: 600; }
        input { width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; transition: border-color 0.2s; }
        input:focus { outline: none; border-color: #1a73e8; }
        button { width: 100%; padding: 0.9rem; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1557b0; }
        #msg { text-align: center; margin-bottom: 1rem; font-size: 0.9rem; padding: 0.5rem; border-radius: 4px; display: none; }
        .error { background: #fee2e2; color: #b91c1c; }
        .success { background: #dcfce7; color: #15803d; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Admin Portal</h2>
    <div id="msg"></div>
    <form id="adminLoginForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter admin username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit">Access Dashboard</button>
    </form>
</div>

<script>
    const API_BASE_URL = 'http://localhost:5000';
    const form = document.getElementById('adminLoginForm');
    const msgDiv = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch(`${API_BASE_URL}/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                msgDiv.textContent = 'Login Successful! Redirecting...';
                msgDiv.className = 'success';
                msgDiv.style.display = 'block';
                
                // Save token for authenticated requests
                localStorage.setItem('adminToken', data.token);
                
                setTimeout(() => { window.location.href = '/admin/'; }, 1000);
            } else {
                msgDiv.textContent = data.message || 'Invalid Credentials';
                msgDiv.className = 'error';
                msgDiv.style.display = 'block';
            }
        } catch (err) {
            console.error('Login Error:', err);
        }
    });
</script>
</body>
</html>
