<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Account | DURKC QUASH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#020617] font-sans text-slate-300 flex items-center justify-center min-h-screen p-6">
    <!-- Animated Balloon Background -->
    <canvas id="balloon-canvas" class="fixed inset-0 z-[-1] pointer-events-none"></canvas>

    <div class="max-w-md w-full bg-white/5 backdrop-blur-xl border border-white/10 p-8 rounded-[2.5rem] shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">Account Activation</h1>
            <p class="text-slate-400 text-sm">To start earning, please pay the activation fee of <span class="text-blue-500 font-bold">Ksh 20</span> via M-Pesa.</p>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">M-Pesa Phone Number</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">+254</span>
                    <input type="text" id="phone" placeholder="712345678" class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-14 pr-4 text-white outline-none focus:border-blue-500 transition shadow-inner">
                </div>
                <p class="text-[10px] text-slate-500 mt-2 italic text-center">Enter your M-Pesa number (e.g., 712345678)</p>
            </div>

            <button id="pay-btn" onclick="initiatePayment()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl transition shadow-lg shadow-blue-900/20 active:scale-95 flex items-center justify-center">
                <span>Pay Ksh 20 Now</span>
            </button>
            
            <div id="status-msg" class="hidden text-center p-4 rounded-2xl text-sm mt-4"></div>

            <div class="pt-6 border-t border-white/10">
                <button onclick="logout()" class="w-full text-slate-500 hover:text-white transition text-sm flex items-center justify-center gap-2">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </button>
            </div>
        </div>
    </div>

    <script>
        // Robust API URL detection
        const isDevelopment = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname.startsWith('192.168.');
        const API_BASE_URL = isDevelopment 
            ? `${window.location.protocol}//${window.location.hostname}:5000`
            : window.location.origin;

        // Retrieval of user data set during login
        const token = localStorage.getItem('token');
        const userId = localStorage.getItem('userId');
        const userPhone = localStorage.getItem('phoneNumber');

        if (!token || !userId) {
            window.location.href = 'login.html';
        }

        // Pre-fill phone field
        if (userPhone) {
            let cleanPhone = userPhone.replace(/\D/g, '');
            if (cleanPhone.startsWith('254')) cleanPhone = cleanPhone.substring(3);
            else if (cleanPhone.startsWith('0')) cleanPhone = cleanPhone.substring(1);
            document.getElementById('phone').value = cleanPhone;
        }

        async function initiatePayment() {
            const phone = document.getElementById('phone').value.trim();
            const payBtn = document.getElementById('pay-btn');
            const statusMsg = document.getElementById('status-msg');

            if (!phone || phone.length < 9) {
                alert('Please enter a valid M-Pesa phone number');
                return;
            }

            payBtn.disabled = true;
            payBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Initializing Gateway...';
            statusMsg.classList.add('hidden');

            try {
                const response = await fetch(`${API_BASE_URL}/api/payments/submit-order`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        amount: 20,
                        phone: phone,
                        type: 'activation_fee',
                        userId: userId
                    })
                });

                const data = await response.json();

                if (data.success && data.redirect_url) {
                    statusMsg.className = 'block bg-emerald-500/10 text-emerald-500 p-4 rounded-2xl text-sm mt-4';
                    statusMsg.innerText = 'Payment initialized. Redirecting to PesaPal...';
                    
                    // Redirect user to the actual PesaPal payment page
                    window.location.href = data.redirect_url;
                } else {
                    throw new Error(data.message || 'Payment failed to initiate. Please try again.');
                }
            } catch (error) {
                console.error('Payment Error:', error);
                statusMsg.className = 'block bg-red-500/10 text-red-500 p-4 rounded-2xl text-sm mt-4';
                statusMsg.innerText = error.message;
                payBtn.disabled = false;
                payBtn.innerHTML = 'Pay Ksh 20 Now';
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        // Balloon Background
        const canvas = document.getElementById('balloon-canvas');
        const ctx = canvas.getContext('2d');
        let balloons = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        class B { constructor() { this.r=25; this.x=Math.random()*canvas.width; this.y=Math.random()*canvas.height; this.dx=(Math.random()-0.5)*1.5; this.dy=(Math.random()-0.5)*1.5; this.c=`hsla(${Math.random()*360},60%,50%,0.15)`; } u() { if(this.x+this.r>canvas.width||this.x-this.r<0)this.dx*=-1; if(this.y+this.r>canvas.height||this.y-this.r<0)this.dy*=-1; this.x+=this.dx; this.y+=this.dy; ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fillStyle=this.c; ctx.fill(); } }
        for(let i=0;i<25;i++)balloons.push(new B());
        function animate() { ctx.clearRect(0,0,canvas.width,canvas.height); balloons.forEach(b=>b.u()); requestAnimationFrame(animate); } animate();
    </script>
</body>
</html>
