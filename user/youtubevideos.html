<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Rewards | DURKC QUASH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Aspect ratio for YouTube 16:9 */
        .video-thumbnail {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
        }
        .video-thumbnail iframe {
            position: absolute; /* Ensure iframe fills the container */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 1.5rem;
        }
        .claim-btn:disabled {
            cursor: not-allowed;
            filter: grayscale(1);
            opacity: 0.5;
        }
    </style>
</head>
<body class="bg-[#020617] font-sans text-slate-300">
    <!-- YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>


    <!-- Animated Balloon Background -->
    <canvas id="balloon-canvas" class="fixed inset-0 z-[-1] pointer-events-none"></canvas>

    <!-- Mobile Sidebar Toggle Button -->
    <button id="mobile-toggle" class="md:hidden fixed top-6 left-6 z-[60] w-12 h-12 flex items-center justify-center bg-slate-900/90 border border-white/10 rounded-2xl text-blue-500 shadow-2xl active:scale-90 transition-all backdrop-blur-md">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 7h16M4 12h10M4 17h16"></path>
        </svg>
    </button>

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden md:hidden transition-opacity duration-300"></div>

    <div class="flex min-h-screen relative">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-64 bg-slate-950/50 backdrop-blur-xl border-r border-white/10 text-slate-400 fixed md:sticky inset-y-0 left-0 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col flex-shrink-0">
            <div class="p-6">
                <span class="text-2xl font-bold text-white">DURKC <span class="text-blue-500">QUASH</span></span>
            </div>
            <nav class="flex-1 px-4 space-y-1 mt-4">
                <a href="dashboard.html" class="flex items-center space-x-3 hover:bg-slate-800 p-3 rounded-xl transition">
                    <i class="fas fa-chart-pie w-5"></i>
                    <span>Dashboard</span>
                </a>
                <a href="spin.html" class="flex items-center space-x-3 hover:bg-slate-800 p-3 rounded-xl transition">
                    <i class="fas fa-dharmachakra w-5"></i>
                    <span>Lucky Spin</span>
                </a>
                <a href="youtubevideos.html" class="flex items-center space-x-3 bg-blue-600 text-white p-3 rounded-xl transition">
                    <i class="fab fa-youtube w-5"></i>
                    <span>YouTube Rewards</span>
                </a>
                <a href="tiktok_videos.html" class="flex items-center space-x-3 hover:bg-slate-800 p-3 rounded-xl transition">
                    <i class="fab fa-tiktok w-5"></i>
                    <span>TikTok Rewards</span>
                </a>
                <a href="surveys.html" class="flex items-center space-x-3 hover:bg-slate-800 p-3 rounded-xl transition">
                    <i class="fas fa-poll-h w-5"></i>
                    <span>Surveys</span>
                </a>
                <a href="refferals.html" class="flex items-center space-x-3 hover:bg-slate-800 p-3 rounded-xl transition">
                    <i class="fas fa-users w-5"></i>
                    <span>Referrals</span>
                </a>
                <a href="wallet.html" class="flex items-center space-x-3 hover:bg-slate-800 p-3 rounded-xl transition">
                    <i class="fas fa-wallet w-5"></i>
                    <span>Withdraw</span>
                </a>
                <a href="membership.html" class="flex items-center space-x-3 hover:bg-slate-800 p-3 rounded-xl transition">
                    <i class="fas fa-crown w-5"></i>
                    <span>Membership</span>
                </a>
                <a href="settings.html" class="flex items-center space-x-3 hover:bg-slate-800 p-3 rounded-xl transition">
                    <i class="fas fa-cog w-5"></i>
                    <span>Settings</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-6 md:p-10">
            <header class="mb-10 flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold text-white">YouTube Rewards</h1>
                    <p class="text-slate-500 text-sm">Watch viral content and earn Ksh instantly.</p>
                </div>
                <div class="bg-white/5 border border-white/10 px-4 py-2 rounded-2xl">
                    <p class="text-[10px] font-bold text-slate-500 uppercase">Daily Limit</p>
                    <p class="text-white font-bold">0 / 10 Videos</p>
                </div>
            </header>

            <!-- Video Grid -->
            <div id="video-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Video cards will be injected here -->
            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        let allVideos = [];
        let youtubePlayers = {};
        let youtubeAPIReady = false;

        // Mobile Sidebar Functionality
        const sidebar = document.getElementById('sidebar');
        const mobileToggle = document.getElementById('mobile-toggle');
        const overlay = document.getElementById('sidebar-overlay');
        function toggleSidebar() { sidebar.classList.toggle('-translate-x-full'); overlay.classList.toggle('hidden'); }
        mobileToggle.onclick = toggleSidebar;
        overlay.onclick = toggleSidebar;

        document.addEventListener('DOMContentLoaded', fetchVideos);

        async function fetchVideos() {
            try {
                const res = await fetch('/api/tasks/videos/youtube', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('Failed to fetch videos');
                const videos = await res.json(); // Assuming this returns an array of video objects
                allVideos = videos; // Store fetched videos globally
                renderVideos(videos);
                if (youtubeAPIReady) initializeYoutubePlayers();
            } catch (err) {
                console.error("Error fetching videos:", err);
            }
        }

        function renderVideos(videos) {
            const container = document.getElementById('video-grid');
            const activeVideos = videos.filter(v => v.status === 'active');
            
            if (activeVideos.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-slate-500 py-10">No videos available at the moment. Check back later!</p>`;
                return;
            }

            container.innerHTML = activeVideos.map(v => `
                <div class="video-card bg-white/5 border border-white/10 rounded-[2.5rem] p-6 flex flex-col space-y-4 hover:border-blue-500/30 transition">
                    <div class="video-thumbnail bg-slate-900 rounded-3xl group relative">
                        <div id="youtube-player-${v.id}"></div>
                    </div>
                    
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="text-[10px] font-bold text-blue-500 uppercase">${v.platform}</p>
                            <h3 class="font-bold text-white text-base">${v.title}</h3>
                        </div>
                        <div class="text-right">
                            <p class="text-green-400 font-bold text-lg">Ksh ${parseFloat(v.reward).toFixed(2)}</p>
                        </div>
                    </div>

                    <button onclick="startClaim(this, ${v.duration_seconds}, ${v.id}, ${v.reward})" class="claim-btn w-full bg-blue-600 text-white py-4 rounded-2xl font-bold transition flex items-center justify-center space-x-2 shadow-lg shadow-blue-900/20">
                        <span>Watch & Claim</span>
                    </button>
                </div>
            `).join('');
            
            const limitDisplay = document.querySelector('header .bg-white\\/5 .text-white');
            if (limitDisplay) limitDisplay.innerText = `${activeVideos.length} / 10 Videos`;
        }

        // This function is called by the YouTube API when it's ready
        function onYouTubeIframeAPIReady() {
            youtubeAPIReady = true;
            initializeYoutubePlayers();
        }

        // Function to initialize players after videos are rendered and API is ready
        function initializeYoutubePlayers() {
            if (!youtubeAPIReady || allVideos.length === 0) {
                return; // Wait for both to be ready
            }

            allVideos.forEach(v => {
                const videoData = v; // v is already the video data

                const match = videoData.video_id.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&?/\s]+)/);
                const cleanId = match ? match[1] : videoData.video_id;

                if (!youtubePlayers[v.id]) { // Only create if not already created
                    youtubePlayers[v.id] = new YT.Player(`youtube-player-${v.id}`, {
                        videoId: cleanId,
                        playerVars: {
                            'controls': 1,
                            'rel': 0,
                            'modestbranding': 1,
                            'enablejsapi': 1,
                            'origin': window.location.origin,
                            'autoplay': 0 // Do not autoplay initially
                        },
                        events: {
                            'onReady': (event) => event.target.mute() // Mute on ready to comply with autoplay policies
                        }
                    });
                }
            });
        }

        async function startClaim(btn, seconds, taskId, rewardAmount) {
            const player = youtubePlayers[taskId];
            if (player && typeof player.playVideo === 'function') {
                player.playVideo();
                player.mute();
            }

            let timeLeft = seconds;
            btn.disabled = true;
            
            const interval = setInterval(async () => {
                // Only decrement if the video is playing
                if (player && typeof player.getPlayerState === 'function') {
                    if (player.getPlayerState() !== YT.PlayerState.PLAYING) {
                        btn.innerHTML = `<i class="fas fa-play mr-2"></i> <span>Play video to earn...</span>`;
                        return;
                    }
                }

                btn.innerHTML = `<i class="fas fa-clock mr-2"></i> <span>Wait ${timeLeft}s</span>`;
                
                if (timeLeft < 0) {
                    clearInterval(interval);
                    
                    try {
                        const res = await fetch('/api/tasks/complete', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({
                                taskType: 'youtube',
                                taskId: taskId,
                                rewardAmount: rewardAmount
                            })
                        });
                        
                        if (res.ok) {
                            btn.innerHTML = `<i class="fas fa-check-circle mr-2"></i> <span>Ksh Claimed!</span>`;
                            btn.className = "w-full bg-emerald-500/20 border border-emerald-500/50 text-emerald-400 py-4 rounded-2xl font-bold cursor-default transition-all flex items-center justify-center space-x-2";
                        } else {
                            const data = await res.json();
                            alert(data.message || 'Failed to claim reward');
                            btn.disabled = false;
                            btn.innerHTML = '<span>Watch & Claim</span>';
                        }
                    } catch (err) {
                        console.error("Error completing task:", err);
                        alert("Connection error. Please try again.");
                        btn.disabled = false;
                        btn.innerHTML = '<span>Watch & Claim</span>';
                    }
                }
                timeLeft--;
            }, 1000);
        }

        // Balloon Background Logic
        const canvas = document.getElementById('balloon-canvas');
        const ctx = canvas.getContext('2d');
        let balloons = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Balloon {
            constructor() {
                this.radius = 25; // 50px diameter
                this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
                this.y = Math.random() * (canvas.height - this.radius * 2) + this.radius;
                this.dx = (Math.random() - 0.5) * 2; // Random velocity X
                this.dy = (Math.random() - 0.5) * 2; // Random velocity Y
                this.color = `hsla(${Math.random() * 360}, 70%, 60%, 0.3)`;
            }

            draw() {
                ctx.beginPath();
                // Draw the balloon body
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                // Draw the highlight/shine for a 3D effect
                ctx.beginPath();
                ctx.arc(this.x - this.radius/3, this.y - this.radius/3, this.radius/4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.fill();

                // Draw the small triangle at the bottom
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + this.radius);
                ctx.lineTo(this.x - 5, this.y + this.radius + 10);
                ctx.lineTo(this.x + 5, this.y + this.radius + 10);
                ctx.closePath();
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            update(others) {
                // Collision detection with edges
                if (this.x + this.radius > canvas.width || this.x - this.radius < 0) {
                    this.dx = -this.dx;
                }
                if (this.y + this.radius > canvas.height || this.y - this.radius < 0) {
                    this.dy = -this.dy;
                }

                // Collision detection with other balloons
                for (let other of others) {
                    if (this === other) continue;
                    const dx = other.x - this.x;
                    const dy = other.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < this.radius + other.radius) {
                        // Simple elastic collision (velocity swap)
                        const tempDx = this.dx;
                        const tempDy = this.dy;
                        this.dx = other.dx;
                        this.dy = other.dy;
                        other.dx = tempDx;
                        other.dy = tempDy;

                        // Prevent balloons from sticking together by resolving overlap
                        const overlap = (this.radius + other.radius - distance) / 2;
                        this.x -= (dx / distance) * overlap;
                        this.y -= (dy / distance) * overlap;
                    }
                }

                this.x += this.dx;
                this.y += this.dy;

                this.draw();
            }
        }

        function initBalloons() {
            balloons = [];
            for (let i = 0; i < 50; i++) {
                balloons.push(new Balloon());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            balloons.forEach(balloon => balloon.update(balloons));
            requestAnimationFrame(animate);
        }

        initBalloons();
        animate();
    </script>
</body>
</html>
